; =============================================================================
; ConnectorX - Custom Firmware Starter
; =============================================================================
;
; Custom firmware for ConnectorX boards. It links against the Lumyn Labs
; SDK in lib/LumynLabsSDK, which runs the board's hardware; your animations
; and modules go in src/.
;
; Build: pio run
; Flash: hold BOOTSEL, plug the board in, then pio run -t upload
;
; =============================================================================

[env:cx]
; Pinned, with the Arduino core it brings: the SDK was built against its
; TinyUSB and FreeRTOS.
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#a1df30f0ad7cd1ac389d01701ac36ac917770be8
board = cx
framework = arduino
board_build.core = earlephilhower
board_build.mcu = rp2040
board_build.f_cpu = 133000000L
; The same flash layout as the stock firmware, so the board keeps its files
; when it moves between the two.
board_build.filesystem_size = 204800

lib_deps =
    LumynLabsSDK

build_flags =
    -std=gnu++23
    -DUSE_TINYUSB
    ; The SDK was built with this USB configuration; the framework's
    ; TinyUSB must be too.
    -DCFG_TUSB_CONFIG_FILE=\"custom_tusb_config.h\"
    -DmaxIRQs=64
    ; FreeRTOS configuration
    -DPIO_FRAMEWORK_ARDUINO_ENABLE_FREERTOS
    -D CX_FREERTOS_ENABLED=1
    -D configUSE_CORE_AFFINITY=1
    -D configRUN_MULTIPLE_PRIORITIES=1
    ; The SDK was built without FreeRTOS run-time stats; build the kernel
    ; the same way.
    -D configGENERATE_RUN_TIME_STATS=0
    -D configUSE_STATS_FORMATTING_FUNCTIONS=0
    -I lib/LumynLabsSDK/include

build_unflags = -std=gnu++17

; The SDK's archive holds FastLED and the Adafruit display libraries, and
; its library.json pins ArduinoJson. Adding any of them to lib_deps links a
; second, mismatched copy.
lib_ldf_mode = deep+
lib_archive = yes

debug_tool = cmsis-dap
